<!DOCTYPE html>
<html lang="en" data-color="cobalt">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page paint under the notch/home indicator so
       env(safe-area-inset-bottom) becomes non-zero and the mobile chrome can
       pad itself out of the gesture bar. Without it the 28px status strip sits
       on top of the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="BoarAi WebUI - Web interface for BoarAi AI Agent Framework">
  <!-- Mobile browser chrome follows the canvas colours (light / dark). -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101828" media="(prefers-color-scheme: dark)">
  <title>BoarAi WebUI</title>

  <script src="/static/js/auth.js"></script>
  
  <!-- Favicon: cobalt rounded square + white boar-head silhouette -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Cpath d='M32 46c0-10 8-18 18-18s18 8 18 18v22l-6-4-6 4-6-4-6 4-6-4-6 4z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='43' cy='47' r='3' fill='white'/%3E%3Ccircle cx='57' cy='47' r='3' fill='white'/%3E%3Ccircle cx='43' cy='47' r='1.5' fill='%232563eb'/%3E%3Ccircle cx='57' cy='47' r='1.5' fill='%232563eb'/%3E%3Cellipse cx='36' cy='43' rx='4' ry='2' fill='white' transform='rotate(-25 36 43)'/%3E%3Cellipse cx='64' cy='43' rx='4' ry='2' fill='white' transform='rotate(25 64 43)'/%3E%3C/svg%3E">
  
  <!-- Theme early (before paint) so dark mode / data-theme apply without flash -->
  <script src="/static/js/theme.js"></script>

  <!-- TailwindCSS (Play CDN - local file) -->
  <script src="/static/js/tailwindcss.js"></script>
  <script>
    // TailwindCSS custom configuration
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Brand actions resolve through variables.css; accents stay semantic.
            primary: {
              DEFAULT: 'rgb(var(--primary-rgb) / <alpha-value>)',
              light: 'rgb(var(--primary-400) / <alpha-value>)',
              dark: 'rgb(var(--primary-700) / <alpha-value>)',
              50: 'rgb(var(--primary-50) / <alpha-value>)',
              100: 'rgb(var(--primary-100) / <alpha-value>)',
              200: 'rgb(var(--primary-200) / <alpha-value>)',
              300: 'rgb(var(--primary-300) / <alpha-value>)',
              400: 'rgb(var(--primary-400) / <alpha-value>)',
              500: 'rgb(var(--primary-500) / <alpha-value>)',
              600: 'rgb(var(--primary-600) / <alpha-value>)',
              700: 'rgb(var(--primary-700) / <alpha-value>)',
              800: 'rgb(var(--primary-800) / <alpha-value>)',
              900: 'rgb(var(--primary-900) / <alpha-value>)',
              950: 'rgb(var(--primary-950) / <alpha-value>)',
            },
            gray: {
              50: '#f7f8fa', 100: '#f0f2f5', 200: '#e4e7ec',
              300: '#d0d5dd', 400: '#98a2b3', 500: '#667085',
              600: '#475467', 700: '#344054', 750: '#1d2939',
              800: '#1d2939', 900: '#101828', 950: '#0c111d',
            },
            mint: {
              DEFAULT: '#2dd4a8', soft: '#e8faf3', dark: '#087252',
              50: '#e8faf3', 100: '#d0f5e7', 200: '#a3edda',
              300: '#71dfc0', 400: '#45d3ab', 500: '#2dd4a8',
              600: '#18b88c', 700: '#0b8f68', 800: '#087252',
              900: '#075b43', 950: '#033d2c',
            },
            sun: {
              DEFAULT: '#ffd43b', soft: '#fff7d6', dark: '#765700',
              50: '#fffdf0', 100: '#fff7d6', 200: '#ffeda3',
              300: '#ffe066', 400: '#ffd43b', 500: '#f5c518',
              600: '#d6a400', 700: '#a87b00', 800: '#765700',
              900: '#4e3900', 950: '#2e2300',
            },
            error: {
              DEFAULT: '#e5484d', light: '#f87277', dark: '#c92a32',
            },
            surface: {
              DEFAULT: '#ffffff', light: '#f7f8fa', dark: '#f0f2f5', darker: '#e4e7ec',
            },
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
          },
          spacing: {
            'navbar': '60px',
            'statusbar': '40px',
          },
          backdropBlur: {
            xs: '2px',
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideDown: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(0, 188, 212, 0.5)' },
              '100%': { boxShadow: '0 0 20px rgba(0, 188, 212, 0.8)' },
            },
          },
        },
      },
    }
  </script>
  
  <!-- Custom CSS (base styles + CSS variables) -->
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/polish.css">
  
  <!-- Vue 3 (production build - local file) -->
  <script src="/static/js/vue.global.prod.js"></script>
  
  <!-- Vue Router 4 (local file) -->
  <script src="/static/js/vue-router.global.js"></script>
  
  <!-- Lucide Icons -->
  <script src="/static/js/lucide.js"></script>
  
  <!-- Marked.js for Markdown rendering -->
  <script src="/static/js/marked.min.js"></script>
  
  <!-- Internationalization (i18n) - loaded below with cache busting -->
  
  <style>
    /* Running sessions use a quiet mint sweep over the cobalt selection. */
    .running-session::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 30%,
        rgb(var(--mint-rgb) / 0.10) 45%,
        rgb(var(--mint-rgb) / 0.18) 50%,
        rgb(var(--mint-rgb) / 0.10) 55%,
        transparent 70%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: sweep 2.5s ease-in-out infinite;
    }
    
    @keyframes sweep {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>
<body>
  <!-- Application Mount Point -->
  <div id="app"></div>
  
  <!-- State Management -->
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/store.js"></script>
  
  <!-- Components -->
  <script src="/static/js/components/navbar.js"></script>
  <script src="/static/js/components/statusbar.js"></script>
  <script src="/static/js/components/notification.js"></script>
  <script src="/static/js/components/loading.js"></script>
  <script src="/static/js/components/empty-state.js"></script>
  <script src="/static/js/components/confirm-dialog.js"></script>
  <script src="/static/js/components/chart.js"></script>
  <script src="/static/js/components/ui.js"></script>
  <script src="/static/js/components/extension-settings.js"></script>
  <script src="/static/js/components/file-explorer.js"></script>

  <!-- Page Components -->
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/sessions.js"></script>
  <script src="/static/js/pages/tasks.js"></script>
  <script src="/static/js/pages/extensions.js"></script>
  <script src="/static/js/pages/data.js"></script>
  <script src="/static/js/pages/settings.js"></script>
  <script src="/static/js/pages/unlock.js"></script>
  <script src="/static/js/pages/setup.js"></script>

  <!-- Main Application -->
  <script src="/static/js/app.js"></script>
</body>
</html>
