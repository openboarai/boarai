<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the page paint under the notch/home indicator so
       env(safe-area-inset-bottom) becomes non-zero and the mobile chrome can
       pad itself out of the gesture bar. Without it the 28px status strip sits
       on top of the home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="BoarAi WebUI - Web interface for BoarAi AI Agent Framework">
  <!-- Mobile browser chrome follows the canvas colours (light / dark). -->
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11131a" media="(prefers-color-scheme: dark)">
  <title>BoarAi WebUI</title>

  <script src="/static/js/auth.js"></script>
  
  <!-- Favicon: indigo rounded square + white boar-head silhouette (theme-aligned) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Cpath d='M32 46c0-10 8-18 18-18s18 8 18 18v22l-6-4-6 4-6-4-6 4-6-4-6 4z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='43' cy='47' r='3' fill='white'/%3E%3Ccircle cx='57' cy='47' r='3' fill='white'/%3E%3Ccircle cx='43' cy='47' r='1.5' fill='%236366f1'/%3E%3Ccircle cx='57' cy='47' r='1.5' fill='%236366f1'/%3E%3Cellipse cx='36' cy='43' rx='4' ry='2' fill='white' transform='rotate(-25 36 43)'/%3E%3Cellipse cx='64' cy='43' rx='4' ry='2' fill='white' transform='rotate(25 64 43)'/%3E%3C/svg%3E">
  
  <!-- Theme early (before paint) so dark mode / data-theme apply without flash -->
  <script src="/static/js/theme.js"></script>

  <!-- TailwindCSS (Play CDN - local file) -->
  <script src="/static/js/tailwindcss.js"></script>
  <script>
    // TailwindCSS custom configuration
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Single source of truth: CSS variables in variables.css.
            // `primary` resolves via rgb(var(--primary-rgb) / <alpha>) so both
            // the indigo default and the violet data-color variant just work.
            primary: {
              DEFAULT: 'rgb(var(--primary-rgb) / <alpha-value>)',
              light: 'rgb(var(--primary-400) / <alpha-value>)',
              dark: 'rgb(var(--primary-600) / <alpha-value>)',
              50: 'rgb(var(--primary-50) / <alpha-value>)',
              100: 'rgb(var(--primary-100) / <alpha-value>)',
              200: 'rgb(var(--primary-200) / <alpha-value>)',
              300: 'rgb(var(--primary-300) / <alpha-value>)',
              400: 'rgb(var(--primary-400) / <alpha-value>)',
              500: 'rgb(var(--primary-500) / <alpha-value>)',
              600: 'rgb(var(--primary-600) / <alpha-value>)',
              700: 'rgb(var(--primary-700) / <alpha-value>)',
              800: 'rgb(var(--primary-800) / <alpha-value>)',
              900: 'rgb(var(--primary-900) / <alpha-value>)',
            },
            secondary: {
              DEFAULT: '#ff9800',
              light: '#ffb74d',
              dark: '#f57c00',
            },
            success: {
              DEFAULT: '#4caf50',
              light: '#81c784',
              dark: '#388e3c',
            },
            warning: {
              DEFAULT: '#ff9800',
              light: '#ffb74d',
              dark: '#f57c00',
            },
            error: {
              DEFAULT: '#f44336',
              light: '#e57373',
              dark: '#d32f2f',
            },
            info: {
              DEFAULT: '#2196f3',
              light: '#64b5f6',
              dark: '#1976d2',
            },
            surface: {
              DEFAULT: '#ffffff',
              light: '#fafafa',
              dark: '#f5f5f5',
              darker: '#eeeeee',
            },
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
          },
          spacing: {
            'navbar': '60px',
            'statusbar': '40px',
          },
          backdropBlur: {
            xs: '2px',
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideDown: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(0, 188, 212, 0.5)' },
              '100%': { boxShadow: '0 0 20px rgba(0, 188, 212, 0.8)' },
            },
          },
        },
      },
    }
  </script>
  
  <!-- Custom CSS (base styles + CSS variables) -->
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/polish.css">
  
  <!-- Vue 3 (production build - local file) -->
  <script src="/static/js/vue.global.prod.js"></script>
  
  <!-- Vue Router 4 (local file) -->
  <script src="/static/js/vue-router.global.js"></script>
  
  <!-- Lucide Icons -->
  <script src="/static/js/lucide.js"></script>
  
  <!-- Marked.js for Markdown rendering -->
  <script src="/static/js/marked.min.js"></script>
  
  <!-- Internationalization (i18n) - loaded below with cache busting -->
  
  <!-- Update loading screen text with i18n and initialize Lucide icons -->
  <script>
    // Color theme: CSS variables in variables.css are the single source of
    // truth. Setting `data-color` re-themes everything (Tailwind primary
    // resolves via rgb(var(--primary-rgb))). No JS color maps to keep in sync.
    function applyColorTheme(colorName) {
      const value = colorName === 'purple' ? 'purple' : 'cyan';
      document.documentElement.setAttribute('data-color', value);
      // Transition color smoothly (CSS handles .color-transition)
      document.documentElement.classList.add('color-transition');
      setTimeout(() => document.documentElement.classList.remove('color-transition'), 300);
    }

    // Initialize color theme from localStorage
    const savedColor = localStorage.getItem('boarai-color') || 'cyan';
    applyColorTheme(savedColor);

    // Listen for color theme changes
    window.addEventListener('color-changed', function(e) {
      applyColorTheme(e.detail.color);
    });
  </script>
  
  <style>
    /* Running session sweep animation — tinted with the theme primary color
       (a green band over the purple selected item read as a rendering bug). */
    .running-session::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 30%,
        rgb(var(--primary-rgb) / 0.10) 45%,
        rgb(var(--primary-rgb) / 0.18) 50%,
        rgb(var(--primary-rgb) / 0.10) 55%,
        transparent 70%,
        transparent 100%
      );
      background-size: 200% 100%;
      animation: sweep 2.5s ease-in-out infinite;
    }
    
    @keyframes sweep {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>
<body>
  <!-- Application Mount Point -->
  <div id="app"></div>
  
  <!-- State Management -->
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/store.js"></script>
  
  <!-- Components -->
  <script src="/static/js/components/navbar.js"></script>

  <!-- Page Components -->

  <script src="/static/js/pages/sessions.js"></script>
  <script src="/static/js/pages/tasks.js"></script>
  <script src="/static/js/pages/extensions.js"></script>
  <script src="/static/js/pages/data.js"></script>
  <script src="/static/js/pages/settings.js"></script>
  <script src="/static/js/pages/unlock.js"></script>
  <script src="/static/js/pages/setup.js"></script>

  <!-- Main Application -->
  <script src="/static/js/app.js"></script>
</body>
</html>
