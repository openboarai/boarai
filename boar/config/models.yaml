# 未收录版本的兜底：按文件顺序匹配，先具体后宽泛。
families:
  # Anthropic
  - match: "^claude-3([-.].*)?$"
    thinking: {format: none}
  - match: "^claude-.*haiku"
    thinking: {format: none}
  - match: "^claude-(opus|sonnet)-4-[0-5]"
    vendor: anthropic
    context_window: 200000
    input_modalities: [text, image]
    thinking: *anthropic-budget
  - match: "^claude-4-(opus|sonnet|haiku)"
    vendor: anthropic
    context_window: 200000
    input_modalities: [text, image]
    thinking: *anthropic-budget
  - match: "^claude-(opus|sonnet)-4-6"
    vendor: anthropic
    context_window: 200000
    input_modalities: [text, image]
    thinking: *anthropic-adaptive-46
  - match: "^claude-fable"
    vendor: anthropic
    context_window: 1000000
    max_output_tokens: 128000
    input_modalities: [text, image]
    forbids_sampling: true
    thinking:
      <<: *anthropic-adaptive-modern
      can_disable: false
  - match: "^claude-(opus|sonnet)-([5-9]|4-[7-9])"
    vendor: anthropic
    context_window: 200000
    max_output_tokens: 128000
    input_modalities: [text, image]
    forbids_sampling: true
    thinking: *anthropic-adaptive-modern
  # DeepSeek
  - match: "^deepseek-v[4-9]"
    vendor: deepseek
    input_modalities: [text]
    echo_reasoning_content: true
    thinking: *deepseek-v4
  # GLM：5.3 / 5.2 的具体档位必须排在宽泛的 4.5+ 规则前面
  - match: "^glm-5[.\\-p]?3"
    vendor: zai
    input_modalities: [text]
    thinking: *glm-53
  - match: "^glm-5[.\\-p]?2"
    vendor: zai
    input_modalities: [text]
    thinking:
      <<: *glm-53
      levels: [high, max]
  - match: "^glm-(4\\.[5-9]|[5-9])"
    vendor: zai
    input_modalities: [text]
    thinking: *glm-toggle
  # Kimi
  - match: "^kimi-k3"
    vendor: moonshot
    input_modalities: [text]
    forbids_sampling: true
    thinking: *kimi-k3
  - match: "^kimi-k[2-9]"
    vendor: moonshot
    input_modalities: [text]
    forbids_sampling: true
    thinking: *kimi-k2
  # Qwen3 世代（含中转的 Qwen3.7-Plus / Qwen3.8-Max 这类命名）
  - match: "^qwen3"
    vendor: alibaba
    input_modalities: [text]
    thinking: *qwen-thinking
  # OpenAI
  - match: "^gpt-5\\.[1-9]"
    vendor: openai
    input_modalities: [text, image]
    thinking: *openai-reasoning-disableable
  - match: "^gpt-5($|[^.])"
    vendor: openai
    input_modalities: [text, image]
    thinking:
      format: openai
      levels: [low, medium, high]
      level_map: {"off": minimal, xhigh: high}
      can_disable: true
      supports_effort: true
  - match: "^o[1-9]($|-)"
    vendor: openai
    input_modalities: [text, image]
    thinking: *openai-reasoning-mandatory
  - match: "^gpt-4o"
    vendor: openai
    context_window: 128000
    input_modalities: [text, image]
    thinking: {format: none}
  - match: "^gpt-4\\.1"
    vendor: openai
    context_window: 1048576
    input_modalities: [text, image]
    thinking: {format: none}
  # Grok / Gemini
  - match: "^grok-4\\.[1-9]"
    vendor: xai
    input_modalities: [text, image]
    thinking: *openai-reasoning-disableable
  - match: "^grok-[34]($|[^.])"
    vendor: xai
    input_modalities: [text, image]
    thinking: *openai-reasoning-mandatory
  - match: "^gemini-[2-9]"
    vendor: google
    input_modalities: [text, image]
    thinking: *gemini-reasoning
  # MiMo
  - match: "^mimo-v[2-9]"
    vendor: xiaomi
    context_window: 65536
    thinking: *legacy-effort
