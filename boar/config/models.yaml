    input_modalities: [text, image]
    forbids_sampling: true
    thinking:
      <<: *anthropic-adaptive-modern
      can_disable: false        # 强制推理：发 disabled 会 400，off 退到最低档

  # ══ DeepSeek ═══════════════════════════════════════════════════════════
  # V4 起：每次请求都必须显式带 thinking 开关（省略则服务端默认开启，并要求
  # 后续轮次回传 reasoning_content，否则第一次工具调用后 400）。R1 恒定推理，
  # V3 及更早没有思考开关。
  - id: deepseek-v4-flash
    vendor: deepseek
    context_window: 1048576
    input_modalities: [text]
    aliases: [deepseek-flash]
    echo_reasoning_content: true
    thinking: &deepseek-v4
      format: deepseek
      levels: [low, medium, high, max]
      level_map: {xhigh: max}
      can_disable: true
      supports_effort: true
  # 历史 id：现在指向 V4 Flash，思考行为与 V4 相同，但上下文长度沿用本项目
  # 一直在用的数值（中转可能并不放开到 1M），需要时在覆盖层改。
  - id: deepseek-chat
    vendor: deepseek
    context_window: 65536
    input_modalities: [text]
    echo_reasoning_content: true
    thinking: *deepseek-v4
  - id: deepseek-reasoner
    vendor: deepseek
    context_window: 65536
    input_modalities: [text]
    echo_reasoning_content: true
    thinking: *deepseek-v4
  - id: deepseek-v4-pro
    vendor: deepseek
    input_modalities: [text]
    echo_reasoning_content: true
    thinking: *deepseek-v4
  - id: deepseek-v3
    vendor: deepseek
    context_window: 65536
    input_modalities: [text]
    thinking: {format: none}
  - id: deepseek-r1
    vendor: deepseek
    context_window: 65536
    input_modalities: [text]
    thinking: {format: none}
  - id: deepseek-v2
    vendor: deepseek
    context_window: 128000
    input_modalities: [text]
    thinking: {format: none}

  # ══ GLM / Z.AI ═════════════════════════════════════════════════════════
  # 4.5 起有 thinking 开关（接受显式 disabled）；5.2 增加 high/max 两档
  # reasoning_effort；5.3 扩展为 low/medium/high/max 四档。4.5 之前无开关。
  - id: glm-5.3
    vendor: zai
    input_modalities: [text]
    aliases: [glm-5-3, glm-5p3, zai-org-glm-5-3]
    thinking: &glm-53
      format: zai
      levels: [low, medium, high, max]
      level_map: {xhigh: max}
      can_disable: true
      supports_effort: true
      enable_value: {type: enabled}
      disable_value: {type: disabled}
  - id: glm-5.2
    vendor: zai
    input_modalities: [text]
    aliases: [glm-5-2, glm-5p2]
    thinking:
      <<: *glm-53
      levels: [high, max]
  - id: glm-5
    vendor: zai
    input_modalities: [text]
    thinking: &glm-toggle
      format: zai
      levels: []
      can_disable: true
      supports_effort: false
      enable_value: {type: enabled}
      disable_value: {type: disabled}
  - id: glm-4.6
    vendor: zai
    input_modalities: [text]
    thinking: *glm-toggle
  - id: glm-4.5
    vendor: zai
    input_modalities: [text]
    thinking: *glm-toggle

  # ══ Kimi / Moonshot ════════════════════════════════════════════════════
  # chat_completions 端点上 thinking 与 reasoning_effort 互斥，同时发会 400：
  # 有档位时只发 effort，只有关闭时才发 thinking。Moonshot 还不接受采样温度。
  # 同一批模型也有 Anthropic 兼容端点，那边说的是 adaptive thinking，而且关闭
  # 的方式是不发字段，所以按协议分别声明。
  - id: kimi-k3
    vendor: moonshot
    input_modalities: [text]
    aliases: [k3]
    forbids_sampling: true
    thinking: &kimi-k3
      openai:
        format: moonshot
        levels: [low, high, max]
        level_map: {medium: high, xhigh: max}
        can_disable: true
        supports_effort: true
        disable_value: {type: disabled}
      anthropic:
        format: anthropic
        adaptive: true
        levels: [low, high, max]
        level_map: {medium: high, xhigh: max}
        can_disable: false      # 该端点上「关闭」就是不发字段
        supports_effort: true
  - id: kimi-k2-thinking
    vendor: moonshot
    input_modalities: [text]
    forbids_sampling: true
    thinking: &kimi-k2
      openai:
        format: moonshot
        levels: [low, medium, high]
        level_map: {xhigh: high}
        can_disable: true
        supports_effort: true
        disable_value: {type: disabled}
      anthropic:
        format: anthropic
        adaptive: true
        levels: [low, medium, high]
        level_map: {xhigh: high}
        can_disable: false
        supports_effort: true
  - id: kimi-k2-turbo-preview
    vendor: moonshot
    input_modalities: [text]
    forbids_sampling: true
    thinking: *kimi-k2
  - id: moonshot-v1-8k
    vendor: moonshot
    context_window: 8192
    input_modalities: [text]
    thinking: {format: none}
  - id: moonshot-v1-32k
    vendor: moonshot
    context_window: 32768
    input_modalities: [text]
    thinking: {format: none}
  - id: moonshot-v1-128k
    vendor: moonshot
    context_window: 128000
    input_modalities: [text]
    thinking: {format: none}

