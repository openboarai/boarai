# BoarAi 模型目录 —— 只读事实层
#
# 这里存的是核心无法从请求里推断出来的厂商事实：上下文长度、思考档位与请求体
# 形态、采样参数约束、是否需要回传 reasoning_content、输入模态。
#
# 本文件不在 boar/defaults/ 下，因此 bootstrap 不会把它复制进用户数据目录
# （copy_defaults 只复制 boar/defaults/），升级即对所有安装生效。
#
# 与某一次安装有关的修正写在 .boarai/config/llm.yaml：上下文长度用
# context_windows，思考形态用该 provider 的 options.thinking 或
# model_info.<model>.thinking。本文件在运行时只读，没有用户副本，也没有编辑器。
#
# 匹配顺序：精确 id → aliases → families 正则（按文件顺序，先具体后宽泛）。
# 什么都没匹配到的模型视为未知：不发送任何思考字段，
# 上下文长度回退到 llm.yaml 的 context_windows，再回退到「未知」。
#
# thinking.format 的取值与含义见 core/llm/thinking/wire.py：
#   openai | openrouter | deepseek | moonshot | zai | qwen | qwen-template |
#   together | anthropic | string | none
#
# 我们的 UI 档位到「请求档位」的固定映射在 core/session/thinking/config.py：
#   auto → 不发字段   off → off   light → low   deep → medium   ultra → xhigh
# 下面每个模型的 levels / level_map 决定这个请求档位最终落到厂商的哪个值。

version: 1

models:
  # ══ Anthropic ══════════════════════════════════════════════════════════
  # Claude 3 / 3.5 没有扩展思考请求字段；3.7 到 4.5 用 budget 块（不发即关闭，
  # 且开启时 temperature 必须为 1）；4.6 起是 adaptive；4.7 起还拒绝任何非默认
  # 采样参数。Haiku 全系没有扩展思考。claude-fable 强制推理，显式关闭会 400。
  - id: claude-3-opus-20240229
    vendor: anthropic
    context_window: 200000
    max_output_tokens: 4096
    input_modalities: [text, image]
    thinking: {format: none}
  - id: claude-3-sonnet-20240229
    vendor: anthropic
    context_window: 200000
    max_output_tokens: 4096
    input_modalities: [text, image]
    thinking: {format: none}
  - id: claude-3-haiku-20240307
    vendor: anthropic
    context_window: 200000
    max_output_tokens: 4096
    input_modalities: [text, image]
    thinking: {format: none}
  - id: claude-3-5-sonnet-20240620
    vendor: anthropic
    context_window: 200000
    max_output_tokens: 8192
    input_modalities: [text, image]
    thinking: {format: none}
  - id: claude-3-5-sonnet-20241022
    vendor: anthropic
    context_window: 200000
    max_output_tokens: 8192
    input_modalities: [text, image]
    thinking: {format: none}
  - id: claude-3-5-sonnet-20250219
    vendor: anthropic
