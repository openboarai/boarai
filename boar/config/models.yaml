  # ══ OpenAI ═════════════════════════════════════════════════════════════
  # 非推理模型（gpt-4o / 4.1 / 3.5）不接受 reasoning_effort，发了会 400，
  # 所以显式登记为 format: none。o 系列无法关闭思考；gpt-5 用 minimal 兜底，
  # 5.1 起接受 none。
  - id: gpt-5.6
    vendor: openai
    input_modalities: [text, image]
    thinking: &openai-reasoning-disableable
      format: openai
      levels: [low, medium, high]
      level_map: {"off": none, xhigh: high}   # off 必须加引号：YAML 1.1 会把它解析成布尔 False
      can_disable: true
      supports_effort: true
