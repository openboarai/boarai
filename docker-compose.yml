# BoarAI — SOURCE channel (the default): the copied tree IS the install, and
# the update steward swaps verified release archives into it in place. Build
# from a checkout next to this file — or an unpacked PyPI sdist, which carries
# the same tree:
#   docker compose up -d --build
#   host port : BOARAI_HOST_PORT=8080 docker compose up -d --build
# If you only have this one file and no tree, use docker-compose.pypi.yml or
# docker-compose.github.yml instead — both are fully self-contained.
#
# DATA / FIRST-RUN KEY — same as the docker-compose.pypi.yml header: ./.boarai
# next to this file survives everything; the first-run log prints a one-shot
# setup code for claiming the WebUI key. Upgrading from the old named-volume
# install? See the upgrade-order warning in that header — same container name,
# same data folder.

name: boarai

services:
  boarai:
    build:
      context: .
      dockerfile: Dockerfile
    image: boarai:local
    container_name: boarai
    # tini as PID 1: the kernel spawns subprocesses (shell tools).
    init: true
    ports:
      - "${BOARAI_HOST_PORT:-26620}:26620"
    volumes:
      - ${BOARAI_DATA_HOST_DIR:-./.boarai}:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
