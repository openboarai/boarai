# BoarAI — GitHub channel: the image clones the repo and keeps .git + origin,
# so an in-container self-update stays on the git channel (fetch + checkout).
#
# SELF-CONTAINED: the Dockerfile is inlined; paste this one file anywhere:
#   docker compose -f docker-compose.github.yml up -d --build
# Requires Docker Compose >= 2.17 (build.dockerfile_inline).
#
#   pin a ref   : BOARAI_GIT_REF=v0.1.2 docker compose -f docker-compose.github.yml up -d --build
#   other fork  : BOARAI_GIT_REPO=https://github.com/<you>/boarai.git docker compose ...
#   host port   : BOARAI_HOST_PORT=8080 docker compose -f docker-compose.github.yml up -d --build
#
# DATA / FIRST-RUN KEY — same as the docker-compose.pypi.yml header: ./.boarai
# next to this file survives everything; the first-run log prints a one-shot
# setup code for claiming the WebUI key. Upgrading from the old named-volume
# install? See the upgrade-order warning in that header — same container name,
# same data folder.

name: boarai

services:
  boarai:
    build:
      context: .
      args:
        BOARAI_GIT_REPO: "${BOARAI_GIT_REPO:-https://github.com/openboarai/boarai.git}"
        BOARAI_GIT_REF: "${BOARAI_GIT_REF:-main}"
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        # Every dollar sign is doubled: compose interpolates this whole block
        # before the builder sees it.
        FROM python:3.12-slim
        # tiktoken encoding cache lives in the data dir: downloaded once,
        # reused across rebuilds instead of re-fetched per container.
        ENV PYTHONUNBUFFERED=1 \
            BOARAI_DATA_DIR=/data \
            TIKTOKEN_CACHE_DIR=/data/.tiktoken
        RUN apt-get update \
         && apt-get install -y --no-install-recommends git \
         && rm -rf /var/lib/apt/lists/*
        ARG BOARAI_GIT_REPO=https://github.com/openboarai/boarai.git
        ARG BOARAI_GIT_REF=main
        RUN git clone --origin origin "$$BOARAI_GIT_REPO" /opt/boarai \
         && git -C /opt/boarai checkout "$$BOARAI_GIT_REF"
        WORKDIR /opt/boarai
        # pip cache mount: wheels persist between builds, requirements layers
        # are cheap after the first build.
        RUN --mount=type=cache,target=/root/.cache/pip \
            pip install -r requirements.txt
        CMD ["python", "main.py"]
    image: boarai-github:local
    container_name: boarai
    # tini as PID 1: the kernel spawns subprocesses (shell tools AND git).
    init: true
    ports:
      - "${BOARAI_HOST_PORT:-26620}:26620"
    volumes:
      - ${BOARAI_DATA_HOST_DIR:-./.boarai}:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
