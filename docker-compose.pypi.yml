# BoarAI — PyPI channel: pip-install the published package into a python image.
#
# SELF-CONTAINED: the Dockerfile is inlined, so this one file is the whole
# deployment. Paste it anywhere (an empty dir, a NAS compose UI) and run:
#   docker compose -f docker-compose.pypi.yml up -d --build
# Requires Docker Compose >= 2.17 (build.dockerfile_inline).
#
#   pin a release : BOARAI_VERSION=0.1.2 docker compose -f docker-compose.pypi.yml up -d --build
#   host port     : BOARAI_HOST_PORT=8080 docker compose -f docker-compose.pypi.yml up -d --build
#
# DATA — everything the kernel writes (config / sessions / logs / memory /
# cache / agents / user extensions) lands in ./.boarai NEXT TO this file (same
# folder name as a bare-metal ~/.boarai), i.e. inside the directory you picked
# in the NAS UI. It survives down, rebuilds and reboots. A dot-folder is hidden
# in some NAS file managers — enable "show hidden files", or point
# BOARAI_DATA_HOST_DIR at any other path.
#   backup  : tar czf boarai-data.tgz -C ./.boarai .
#   restore : tar xzf boarai-data.tgz -C ./.boarai
#   move it : BOARAI_DATA_HOST_DIR=<absolute path>
# From an older named-volume install? Once, from this directory:
#   docker run --rm -v boarai-data:/from -v "$PWD/.boarai":/to \
#     alpine sh -c "cp -a /from/. /to/"
# UPGRADE ORDER MATTERS: (1) migrate the data with the command above, or
# accept a fresh start; (2) delete the OLD project in the NAS UI WITHOUT
# ticking "delete volumes" — that checkbox destroys the old data
# irrecoverably; (3) deploy this file — the old container must be gone first,
# both projects use the same container name.
#
# FIRST-RUN KEY — the log prints a one-shot setup code; type it into the WebUI
# from any machine (loopback peers need none):
#   docker compose -f docker-compose.pypi.yml logs boarai

name: boarai

services:
  boarai:
    build:
      context: .
      # Incremental rebuilds: base image + dependency layers stay cached; a
      # PyPI freshness probe busts ONLY the boarai layer, so `up -d --build`
      # still picks up the newest release while reinstalling just the boarai
      # wheel. Pin BOARAI_VERSION for a reproducible build.
      args:
        BOARAI_VERSION: "${BOARAI_VERSION:-}"
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        # Every dollar sign is doubled: compose interpolates this whole block
        # before the builder sees it.
        FROM python:3.12-slim
        # tiktoken encoding cache lives in the data dir: downloaded once,
        # reused across rebuilds instead of re-fetched per container.
        # TZ is a POSIX string (glibc parses it without tzdata): UTC+8, no DST.
        # Override at runtime with -e TZ=<posix string or IANA name>.
        ENV PYTHONUNBUFFERED=1 \
            BOARAI_DATA_DIR=/data \
            TIKTOKEN_CACHE_DIR=/data/.tiktoken \
            TZ=CST-8
        # Dependency layer - CACHED across rebuilds: an ordinary rebuild never
        # resolves, downloads or reinstalls these. Keep the list in sync with
        # the dependencies table in pyproject.toml; editing it here is what
        # intentionally busts this layer.
        RUN --mount=type=cache,target=/root/.cache/pip \
            pip install "aiohttp>=3.8.0" "pyyaml>=6.0" "aiofiles>=23.0.0" "tiktoken>=0.5.0"
        # Freshness probe: BuildKit re-checksums this URL on every build, so a
        # new PyPI release invalidates ONLY the layers below - base image and
        # the dependency layer above stay cached.
        ADD https://pypi.org/pypi/boarai/json /tmp/boarai-index.json
        ARG BOARAI_VERSION=
        # boarai only (--no-deps, dependencies already satisfied above): one
        # small wheel is the entire cost of a routine rebuild. --no-deps also
        # skips pip's constraint resolution, so two guards run afterwards:
        # the smoke import catches missing modules, and pip check catches a
        # stale cached dependency layer that no longer satisfies the new
        # boarai requirement bounds. Either failure triggers the fallback
        # full-resolution reinstall.
        RUN --mount=type=cache,target=/root/.cache/pip \
            set -eu; \
            if [ -n "$$BOARAI_VERSION" ]; then spec="boarai==$$BOARAI_VERSION"; else spec=boarai; fi; \
            pip install --no-deps --upgrade "$$spec"; \
            if ! python -c "import boarai.core, boarai.core.server.unified_server" >/dev/null 2>&1 \
               || ! pip check >/dev/null 2>&1; then \
              pip install --upgrade "$$spec"; \
            fi; \
            rm -f /tmp/boarai-index.json
        CMD ["python", "-m", "boarai"]
    image: boarai-pypi:local
    container_name: boarai
    # tini as PID 1: the kernel spawns subprocesses (shell tools), so signals
    # must be forwarded and orphans reaped.
    init: true
    ports:
      - "${BOARAI_HOST_PORT:-26620}:26620"
    volumes:
      - ${BOARAI_DATA_HOST_DIR:-./.boarai}:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
