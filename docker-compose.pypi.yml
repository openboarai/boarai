# BoarAI — PyPI channel (pip install of the published package).
#
# SELF-CONTAINED: the Dockerfile is inlined below, so this one file is the
# whole deployment. Copy it anywhere (an empty directory, a NAS compose UI)
# and run:
#   docker compose -f docker-compose.pypi.yml up -d --build
# Nothing is read from the build context, so no repo checkout is needed.
# Requires Docker Compose >= 2.17 (build.dockerfile_inline).
#
#   pin a release : BOARAI_VERSION=0.1.1 docker compose -f docker-compose.pypi.yml up -d --build
#   host port     : BOARAI_HOST_PORT=8080 docker compose -f docker-compose.pypi.yml up -d --build
#
# CHANNEL SEMANTICS (not taste): the package sits in a user-owned venv, which
# update/steward detects as the pip channel, so an in-container self-update
# runs `pip install -U boarai` and stays on PyPI. An install never updates
# across channels — use docker-compose.yml (source) or
# docker-compose.github.yml (git) for those.
#
# DATA PERSISTENCE — everything the kernel writes (config / sessions / logs /
# memory / cache / agents / user extensions) lands under BOARAI_DATA_DIR=/data:
#   docker compose -f docker-compose.pypi.yml down      -> data SURVIVES
#   docker compose -f docker-compose.pypi.yml down -v   -> data is DELETED
#   inspect : docker volume inspect boarai-data
#   backup  : docker run --rm -v boarai-data:/data -v "$PWD":/backup \
#               alpine tar czf /backup/boarai-data.tgz -C /data .
#   restore : docker run --rm -v boarai-data:/data -v "$PWD":/backup \
#               alpine tar xzf /backup/boarai-data.tgz -C /data
# Prefer a host directory (typical on a NAS)? Replace the volume line with
#   - /volume1/docker/boarai:/data
# and make it writable by the runtime user FIRST — the image runs as uid/gid
# 10001 (BOARAI_UID/BOARAI_GID below), it is not root:
#   mkdir -p /volume1/docker/boarai && chown -R 10001:10001 /volume1/docker/boarai

name: boarai

services:
  boarai:
    build:
      # The context only has to exist; the inline Dockerfile copies nothing.
      context: .
      # Always full-rebuild (no layer cache) so every `build` / `up -d --build`
      # reinstalls the LATEST published boarai from PyPI instead of reusing a
      # stale cached `pip install` layer. Without this, an unpinned
      # `pip install boarai` is cached by its command string and a rebuild
      # never notices a new release. Trade-off: slower + not reproducible — a
      # rebuild can silently pull whatever was published latest (including a
      # bad release). For cached, reproducible builds set `no_cache: false`
      # (or drop the line) and pin BOARAI_VERSION to a known-good release.
      no_cache: true
      args:
        # Empty = latest published release.
        BOARAI_VERSION: "${BOARAI_VERSION:-}"
        BOARAI_UID: "${BOARAI_UID:-10001}"
        BOARAI_GID: "${BOARAI_GID:-10001}"
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        #
        # NOTE: every dollar sign below is DOUBLED on purpose. Compose
        # interpolates the whole YAML document — dockerfile_inline included —
        # before the builder ever sees it, so an unescaped variable reference
        # is replaced by the HOST's value (usually empty) and groupadd /
        # useradd then exit 3. The shell-level ":-" defaults are a second
        # layer of the same defence: an explicitly empty --build-arg still
        # yields a working image.
        FROM python:3.12-slim

        ARG BOARAI_VERSION=
        ARG BOARAI_UID=10001
        ARG BOARAI_GID=10001

        ENV PYTHONUNBUFFERED=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            BOARAI_DATA_DIR=/data \
            TIKTOKEN_CACHE_DIR=/opt/boarai-tiktoken \
            VIRTUAL_ENV=/opt/venv \
            PATH="/opt/venv/bin:$$PATH"

        # A user-owned venv is what makes the pip channel's in-place
        # `pip install -U boarai` writable; system site-packages under a
        # non-root user is not. Fixed uid/gid so host bind mounts can be
        # chowned to a predictable owner.
        RUN set -eu; \
            uid="$${BOARAI_UID:-10001}"; \
            gid="$${BOARAI_GID:-10001}"; \
            python -m venv /opt/venv; \
            groupadd --system --gid "$$gid" boarai; \
            useradd --system --uid "$$uid" --gid "$$gid" \
                    --create-home --shell /usr/sbin/nologin boarai; \
            mkdir -p /data /opt/boarai-tiktoken; \
            chown -R boarai:boarai /data /opt/boarai-tiktoken /opt/venv

        USER boarai

        RUN set -eu; \
            ver="$${BOARAI_VERSION:-}"; \
            if [ -n "$$ver" ]; then \
              pip install --no-cache-dir "boarai==$$ver"; \
            else \
              pip install --no-cache-dir boarai; \
            fi

        # Bake the cl100k_base encoding into the image; a failed warm-up is
        # not fatal (the kernel falls back to a char-based estimate).
        RUN python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')" || true

        EXPOSE 26620

        # Public endpoint, needs no credential: proves the HTTP edge is serving.
        HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
          CMD python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:26620/api/auth/status', timeout=4)"

        # pip-channel launch shape (update/steward.server_launch_prefix).
        CMD ["python", "-m", "boarai"]
    image: boarai-pypi:local
    container_name: boarai
    # tini as PID 1: the kernel spawns subprocesses (shell tools), so signals
    # must be forwarded and orphans reaped.
    init: true
    ports:
      # host:container — the kernel listens on 26620 inside
      - "${BOARAI_HOST_PORT:-26620}:26620"
    environment:
      BOARAI_DATA_DIR: /data
      # First-run access key. The browser setup page trusts loopback peers
      # only, which a bridged container never sees, so seed the key one of two
      # ways:
      #   1. one-off command (prints the key once):
      #        docker compose -f docker-compose.pypi.yml run --rm boarai python -m boarai key init
      #   2. pre-seed a token here (>=32 base64url chars; adopted on first run
      #      only, never overrides an existing key):
      # BOARAI_API_TOKEN: "replace-with-32-plus-base64url-chars"
    volumes:
      - boarai-data:/data
    restart: unless-stopped
    # The kernel writes through atomic temp+rename, so a hard stop cannot
    # corrupt state; the grace period still lets in-flight requests finish.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  boarai-data:
    # Explicit name: the backup/inspect commands above stay valid no matter
    # which directory compose was invoked from.
    name: boarai-data
